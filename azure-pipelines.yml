# =====================================================================
# Azure Pipelines - WaveMaker app -> Azure App Service (WAR deploy)
# Runtime target: Linux, Java 17, Apache Tomcat 10.1
# Source: GitHub repo (WaveMaker Maven project)
# =====================================================================

variables:
  azureServiceConnection: 'wm-azure-connection'
  appName: 'tets-wm'
  resourceGroup: 'test-learn'
  buildProfile: 'deployment'
  javaVersion: '17'
  nodeVersion: '22.18.0'

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  displayName: 'Build WaveMaker WAR'
  jobs:
    - job: build
      displayName: 'Maven build'
      steps:
        - task: JavaToolInstaller@0
          displayName: 'Set up Java 17'
          inputs:
            versionSpec: '$(javaVersion)'
            jdkArchitectureOption: 'x64'
            jdkSourceOption: 'PreInstalled'

        - task: NodeTool@0
          displayName: 'Set up Node.js'
          inputs:
            versionSpec: '$(nodeVersion)'

        - task: Maven@4
          displayName: 'mvn clean package'
          inputs:
            mavenPomFile: 'pom.xml'
            goals: 'clean package'
            options: '-P$(buildProfile) -DskipTests'
            javaHomeOption: 'JDKVersion'
            jdkVersionOption: '$(javaVersion)'

        - task: CopyFiles@2
          displayName: 'Collect WAR'
          inputs:
            contents: '**/target/*.war'
            targetFolder: '$(Build.ArtifactStagingDirectory)'
            flattenFolders: true

        - script: |
            cd $(Build.ArtifactStagingDirectory)
            mv *.war ROOT.war
            ls -la
          displayName: 'Rename WAR to ROOT.war'

        - task: PublishBuildArtifacts@1
          displayName: 'Publish WAR artifact'
          inputs:
            pathToPublish: '$(Build.ArtifactStagingDirectory)'
            artifactName: 'war'

- stage: Deploy
  displayName: 'Deploy to App Service'
  dependsOn: Build
  condition: succeeded()
  jobs:
    - deployment: deploy
      displayName: 'Deploy WAR'
      environment: 'wm-training'
      strategy:
        runOnce:
          deploy:
            steps:
              - download: current
                artifact: 'war'

              - task: AzureWebApp@1
                displayName: 'Deploy WAR to App Service'
                inputs:
                  azureSubscription: '$(azureServiceConnection)'
                  appType: 'webAppLinux'
                  appName: '$(appName)'
                  resourceGroupName: '$(resourceGroup)'
                  package: '$(Pipeline.Workspace)/war/ROOT.war'
